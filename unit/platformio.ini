; PlatformIO project configuration for the mini-split's own controller.
; Docs: https://docs.platformio.org/page/projectconf.html
;
; This is one of the repo's two firmwares; the wall panel's is in ../panel.
; Each is its own PlatformIO project: they build for different boards, and
; what they have in common is in ../shared. Build this one with
; `pio run -d unit` from the repo root, or by opening
; thermostat.code-workspace in VSCode.

[env:xiao-esp32c3]
; Same platform as the panel, pinned to the same release: one toolchain, one
; Arduino core, so ../shared compiles for both. Bump both together.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

; Seeed XIAO ESP32-C3. Small enough to fit inside the indoor unit, and its
; antenna is external, which is what reception inside a metal chassis needs.
; The board-specific pins are in include/config.h.
board = seeed_xiao_esp32c3
framework = arduino

; 2x ~1.9MB app slots out of the 4MB flash, so an update is written to the one
; that isn't running and the controller can fall back to it — the same
; arrangement as the panel, because a board inside a mini-split is just as
; awkward to reach as one in a wall.
board_build.partitions = min_spiffs.csv

; Shared with the panel: stamps the build with FIRMWARE_VERSION. See the
; script for where the version comes from.
extra_scripts = pre:../tools/firmware_version.py

; ../shared holds the libraries both firmwares use.
lib_extra_dirs = ../shared

lib_deps =
	thermostat_common                               ; shared with the panel firmware
	bblanchon/ArduinoJson@^7.4.3                    ; MQTT messages, same version as the panel
	links2004/WebSockets@^2.7.3                     ; the control API (LGPL-2.1)
	; The CN105 protocol: framing, checksums and the packet types the indoor
	; unit speaks. Pinned to a commit; GPL-3.0, which is why it sits behind our
	; own interface in src/climate/heat_pump.h (see README.md).
	https://github.com/SwiCago/HeatPump#dc898d5ca9579ee50e74a9e334d1a6202aeb0fe8

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

build_unflags =
	-Os
build_flags =
	-O2
	-Wall
	-Wextra
	-Iinclude
	-Isrc
	; The XIAO's USB-C port is wired to the C3's built-in USB, so Serial (the
	; logs) goes there. That leaves the hardware UART free for the heat pump,
	; which the ESP8266 boards couldn't do: there, the two shared one port.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3            ; ESP-IDF logs: 0=none .. 5=verbose
