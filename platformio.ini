; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32c6-touch-lcd]
; The official PlatformIO espressif32 platform stops at Arduino core 2.x,
; which doesn't support the ESP32-C6. pioarduino is the community-maintained
; fork that ships Arduino core 3.x. Pinned to a release so builds are
; reproducible; bump deliberately.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

; Waveshare ESP32-C6-Touch-LCD-1.47 has no board file of its own. The C6
; DevKitC-1 matches it (ESP32-C6, 8MB flash); the board-specific pins are in
; include/config.h.
board = esp32-c6-devkitc-1
framework = arduino

; 2x 3.3MB app slots (room for OTA updates later) + 1.5MB filesystem.
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

lib_deps =
	lvgl/lvgl@^9.5.0                                ; UI toolkit
	moononournation/GFX Library for Arduino@^1.6.7  ; SPI display driver
	bblanchon/ArduinoJson@^7.4.3                    ; reads the mini-split's MQTT messages

; The framework compiles for size (-Os). LVGL draws everything in software,
; so optimize for speed instead; there's plenty of flash to spare.
build_unflags =
	-Os
build_flags =
	-O2
	-Wall
	-Wextra
	-Iinclude
	-Isrc
	; The USB-C port is wired straight to the C6's built-in USB (no separate
	; USB-serial chip), so route Serial over it.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLV_CONF_INCLUDE_SIMPLE        ; LVGL picks up include/lv_conf.h
	-DCORE_DEBUG_LEVEL=3            ; ESP-IDF logs: 0=none .. 5=verbose
